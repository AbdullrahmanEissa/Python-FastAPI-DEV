name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'fastapi-async-fullapp/**'

jobs:
  # JOB 1: Cloud - Builds your FastAPI image and pushes to Docker Hub
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi-async-fullapp
          push: true
          tags: abdueissa/fastapi-app:latest

  # JOB 2: Local VM - Downloads the code and orchestrates the deployment
  deploy-to-vm:
    needs: build-image
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Deploy with Docker Compose
        run: |
          cd fastapi-async-fullapp
          
          # Pull the newly pushed image (and Nginx/Postgres) from Docker Hub
          docker compose pull
          
          # Start or update the containers seamlessly
          docker compose up -d
