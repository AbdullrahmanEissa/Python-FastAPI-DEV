name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'fastapi-async-fullapp/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi-async-fullapp
          push: true
          tags: abdueissa/fastapi-app:latest

      - name: Copy Compose and Nginx files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "fastapi-async-fullapp/docker-compose.yml,fastapi-async-fullapp/nginx.conf"
          target: "~/deploy"
          strip_components: 1

      - name: Deploy to Ubuntu VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            
            cd ~/deploy
            
            
            docker compose pull
            
            
            docker compose up -d
