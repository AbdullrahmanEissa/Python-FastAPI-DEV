version: '3.8'

services:
  api:
    image: abdueissa/fastapi-app:latest
    container_name: fastapi_async_api
    restart: always
    ports:
      - "8000:8000"
    environment:
       # See The Change From The Default DATABASE_URL To Use postgresql+asyncpg:// Instead Of postgresql:// 
      - DATABASE_URL=postgresql+asyncpg://postgres:1@db:5432/postgres
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: postgres_async_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
