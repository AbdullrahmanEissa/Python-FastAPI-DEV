version: '3.8'

services:
  fastapi_app:
    build: .
    container_name: fastapi_backend
    depends_on:
      - postgres_db
    environment:
      - DATABASE_URL=postgresql://postgres:1@postgres_db:5432/postgres
    restart: always

  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi_app
    restart: always

volumes:
  pg_data: